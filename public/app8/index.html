SUG=[[/Relevo/i,'SUP'],[/T3_Moldeador|Sobrantes_T3/i,'PROD'],[/Consolidado|Contabilidad|Costa/i,'COSTA'],[/Control/i,'SIERRA']];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(_){return{}}},store=o=>{try{localStorage.setItem(KEY,JSON.stringify(o))}catch(_){}};
const digits=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('0')&&d.length===10)d='593'+d.slice(1);return d};
const pad=n=>String(n).padStart(2,'0'),now=new Date(),HHMM=()=>{const d=new Date();return pad(d.getHours())+pad(d.getMinutes())};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const TYPES={T1_TO_T2_HANDOFF:'T1_Relevo_para_T2',T2_LOCAL_PRINCIPAL_NOTE:'T2_Nota_Local_Principal',PASTRY_PRODUCTION:'T2_Pasteleria',PRODUCTION_CONSOLIDATED:'T2_Consolidado_Completo',T3_NEXT_DAY_DISPATCH_DRAFT:'T2_Orden_T3_siguiente_dia',PRODUCTION_TO_COSTA_REPORT:'Produccion_para_Costa',PRODUCTION_TO_ACCOUNTING_REPORT:'Produccion_para_Contabilidad',T2_CONTROL:'T2_Control',RESPALDO_T3:'T3_Respaldo'};
function info(n,t){let o={};try{o=JSON.parse(t)}catch(_){}const k=o.manifest?.kind||o.kind||'',role=o.manifest?.sourceRole||'';return{o,k,role}}
function nameOf(n,t){const {o,k,role}=info(n,t);let L=null,d=o.manifest?.operationalDate||(o.archive&&o.archive.operationalDate)||(n.match(/\d{4}-\d{2}-\d{2}/)||[])[0]||today();
 if(k==='T3_PRODUCTION')L=role==='MOLDEADOR_T3'?'T3_Moldeador':'T2_Sobrantes_T3_Pasteleria';
 else if(k==='RESPALDO_CIERRE')L=((o.archive&&o.archive.shift)||'T1')+'_Respaldo_interno';
 else if(TYPES[k])L=TYPES[k];else if(/RESPALDO_T2/i.test(n))L='T2_Respaldo';else if(/RESPALDO_T3/i.test(n))L='T3_Respaldo';else return n;
 return `PANALIM_${L}_${d}_${HHMM()}${/\.panalim\.json$/i.test(n)?'.panalim.json':'.json'}`}
const Q=[];let cur=null,acks={};
const mkFile=f=>new File([f.text],f.name,{type:'application/json'});
function dl(f){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.text],{type:'application/json'}));a.download=f.name;document.body.appendChild(a);a.click();a.remove()}
async function saveAs(f){if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:f.name,types:[{description:'Archivo PANALIM',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(f.text);await w.close();return 'carpeta elegida'}catch(e){if(e&&e.name==='AbortError')return null}}
 try{const file=mkFile(f);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return 'compartido/guardado'}}catch(e){if(e&&e.name==='AbortError')return null}
 dl(f);return 'descargado en Descargas'}
async function shareIt(f){try{const file=mkFile(f);if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:f.name});return 'compartido'}}catch(e){if(e&&e.name==='AbortError')return null}alert('Este navegador no permite compartir adjuntos: use «Guardar…» y adjunte el archivo.');return null}
function modal(){let m=document.getElementById('pnShare');if(m)return m;m=document.createElement('div');m.id='pnShare';m.style.cssText='position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:99999;padding:12px';
 m.innerHTML='<div style="background:#fffefa;border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;padding:16px;font:14px system-ui,sans-serif;color:#2e2825"><b style="font-size:1rem">Archivos listos</b><div id="pnLst" style="margin:8px 0"></div><details style="margin-top:6px"><summary style="font-size:.78rem;cursor:pointer">Avisar por WhatsApp / Telegram</summary><label style="font-size:.74rem;display:block;margin-top:6px">Destino<select id="pnShD" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ded5cc;border-radius:8px"></select></label><label style="font-size:.74rem;display:block">Teléfono (se guarda)<input id="pnShP" inputmode="tel" placeholder="0991234567" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ded5cc;border-radius:8px;box-sizing:border-box"></label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button id="pnShW" style="padding:9px;border-radius:9px;border:0;background:#1a9d55;color:#fff;font-weight:700">WhatsApp</button><button id="pnShT" style="padding:9px;border-radius:9px;border:0;background:#2a8bd1;color:#fff;font-weight:700">Telegram</button></div></details><button id="pnShC" style="width:100%;margin-top:12px;padding:10px;border-radius:9px;border:1px solid #ded5cc;background:#fff;font-weight:700">Cerrar</button></div>';
 document.body.appendChild(m);const $=i=>m.querySelector(i),sel=$('#pnShD');sel.innerHTML=DEST.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');sel.onchange=()=>{$('#pnShP').value=load()[sel.value]||''};
 const phone=()=>{const o=load();o[sel.value]=$('#pnShP').value.trim();store(o);return digits($('#pnShP').value)},msg=()=>`PANALIM · te envío el archivo ${(cur||Q[0]||{}).name||''}.`;
 $('#pnShC').onclick=()=>{m.style.display='none';Q.length=0};
 $('#pnShW').onclick=()=>{const p=phone();window.open('https://wa.me/'+(p||'')+'?text='+encodeURIComponent(msg()),'_blank')};
 $('#pnShT').onclick=()=>{const p=phone();try{navigator.clipboard&&navigator.clipboard.writeText(msg())}catch(_){}window.open(p?'https://t.me/+'+p:'https://t.me/','_blank')};
 m.addEventListener('click',async e=>{const b=e.target.closest('[data-pn]');if(!b)return;const f=Q[+b.dataset.i];if(!f)return;let r=null;if(b.dataset.pn==='save')r=await saveAs(f);else if(b.dataset.pn==='share')r=await shareIt(f);else if(b.dataset.pn==='dl'){dl(f);r='descargado en Descargas'}if(r){f.done=r;cur=f;draw()}});return m}
function draw(){const m=modal(),L=m.querySelector('#pnLst');L.innerHTML=Q.map((f,i)=>`<div style="border:1px solid #ded5cc;border-radius:10px;padding:9px;margin-bottom:8px;background:${f.done?'#eff9f7':'#fff'}"><div style="font-size:.78rem;word-break:break-all"><b>${f.name.replace(/[<&]/g,'')}</b></div>${f.auto?`<div style="font-size:.72rem;color:#0b7c77;margin:3px 0">✓ Ya se envió automáticamente a ${f.auto}</div>`:''}${f.done?`<div style="font-size:.72rem;color:#0b7c77;margin:3px 0">✓ ${f.done}</div>`:''}<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px"><button data-pn="save" data-i="${i}" style="padding:9px 4px;border-radius:9px;border:0;background:#75242a;color:#fff;font-weight:700;font-size:.8rem">Guardar…</button><button data-pn="share" data-i="${i}" style="padding:9px 4px;border-radius:9px;border:1px solid #ded5cc;background:#fff;font-weight:700;font-size:.8rem">Compartir…</button><button data-pn="dl" data-i="${i}" style="padding:9px 4px;border-radius:9px;border:1px solid #ded5cc;background:#fff;font-weight:700;font-size:.8rem">Descargas</button></div></div>`).join('');
 const s=Q[0]&&SUG.find(([re])=>re.test(Q[0].name));if(s)m.querySelector('#pnShD').value=s[1];m.querySelector('#pnShP').value=load()[m.querySelector('#pnShD').value]||'';m.style.display='flex'}
window.PANALIMSave=function(name,text){const f={name:nameOf(name,text),text};if(Q.length&&Q[Q.length-1].name===f.name)Q.pop();Q.push(f);draw();
 if(window.parent&&window.parent!==window){const i=info(f.name,text);try{parent.postMessage({panalimOut:{name:f.name,text,kind:i.k,role:i.role}},location.origin)}catch(_){}}};
window.PANALIMShare=window.PANALIMSave;
const _d=window.downloadText;window.downloadText=function(n,t,ty){if(/\.json$/i.test(n)){window.PANALIMSave(n,t);return}return typeof _d==='function'?_d.apply(this,arguments):null};
/* recibir desde el contenedor */
addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};
 if(d.panalimAck){const f=Q.find(x=>x.name===d.panalimAck.name);if(f){f.auto=d.panalimAck.to;draw()}return}
 if(d.panalimIn){const x=d.panalimIn;try{const inp=document.createElement('input');inp.type='file';inp.id=x.inputId;inp.hidden=true;const dt=new DataTransfer();dt.items.add(new File([x.text],x.name,{type:'application/json'}));inp.files=dt.files;document.body.appendChild(inp);inp.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>inp.remove(),1500)}catch(err){console.error(err)}}});
})();
/* aviso rojo con el error real (para no adivinar) */
(function(){if(window.__pnErr)return;window.__pnErr=1;let last='';
function show(msg,det){if(!msg||/ResizeObserver/i.test(msg)||msg===last)return;last=msg;let b=document.getElementById('pnErr');if(!b){b=document.createElement('div');b.id='pnErr';b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:100002;background:#a53a31;color:#fff;padding:10px 12px;font:600 13px system-ui;display:flex;gap:8px;align-items:center;justify-content:space-between';document.body.appendChild(b)}
 b.innerHTML='<span style="word-break:break-word">⚠ Error: '+String(msg).replace(/[<&]/g,'').slice(0,220)+'</span><span style="display:flex;gap:6px;flex:none"><button data-e="c" style="border:0;border-radius:8px;padding:7px 10px;font-weight:700">Copiar</button><button data-e="x" style="border:0;border-radius:8px;padding:7px 10px">✕</button></span>';
 b.onclick=e=>{const k=e.target.dataset&&e.target.dataset.e;if(k==='x'){b.remove();last=''}if(k==='c'){try{navigator.clipboard.writeText(msg+'\n'+(det||'')+'\n'+location.href+'\n'+navigator.userAgent)}catch(_){}e.target.textContent='Copiado'}}}
addEventListener('error',e=>show(e.message,(e.filename||'')+':'+e.lineno+':'+e.colno+'\n'+(e.error&&e.error.stack||'')));
addEventListener('unhandledrejection',e=>show('Promesa rechazada: '+((e.reason&&e.reason.message)||e.reason),(e.reason&&e.reason.stack)||''))})();

</script>
