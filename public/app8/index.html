  say(e,c,p){return p.name+', '+(c.vals.trays?c.vals.trays+(c.vals.trays===1?' lata':' latas')+' de '+c.vals.ppt:'')+(c.vals.loose?(c.vals.trays?', más ':'')+c.vals.loose+' sueltas':'')+', '+c.u+' unidades'}},
 units:{fields:[{k:'units',l:'Unidades'}],
  build(e,f){if(f.units!=null)e.units=f.units;else if(f.trays!=null)e.units=f.trays*(f.ppt||0)+(f.loose||0);else if(f.loose!=null)e.units=f.loose;else if(f.bare.length)e.units=f.bare[0];if(f.trays!=null&&!f.ppt)e._needPpt=f.trays},
  calc(e,D){const p=D.byCode(e.code),m=[];let u=e.units!=null?e.units:0;if(e._needPpt&&!e.units){const pp=(p&&p.p)||0;if(pp)u=e._needPpt*pp+(e.loose||0);else m.push(['bad','Dijo latas pero falta u/lata.'])}
   if(!p)m.push(['bad','Elija el producto.']);if(!(u>0))m.push(['bad','Sin unidades.']);return{u,m,vals:{units:u}}},
  say(e,c,p){return p.name+', '+c.u+' unidades'}},
 past:{fields:[{k:'dest',l:'Destino',sel:[['COSTA','Costa'],['SIERRA','Sierra']]},{k:'upf',l:'u/funda'},{k:'bags',l:'Fundas'},{k:'loose',l:'Sueltas'},{k:'units',l:'Unidades'}],
  build(e,f){['dest','upf','bags','loose','units'].forEach(k=>{if(f[k]!=null)e[k]=f[k]});if(f.trays!=null&&e.bags==null)e.bags=f.trays;if(e.bags==null&&e.loose==null&&e.units==null&&f.bare.length)e._bare=f.bare[0]},
  calc(e,D){const p=D.byCode(e.code),pv=D.prev(e.code)||{},m=[];let bags=e.bags,units=e.units;const upf=e.upf||pv.upf||D.defUpf(e.code)||0;
   if(e._bare!=null&&bags==null&&units==null){if(upf)bags=e._bare;else units=e._bare}
   let u;if(units!=null)u=units;else u=(bags||0)*upf+(e.loose||0);
   if(!p)m.push(['bad','Elija el producto.']);if(bags&&!upf&&units==null)m.push(['bad','Falta u/funda de '+(p?p.name:'este producto')+'.']);if(!(u>0))m.push(['bad','Sin cantidad.']);
   return{u,m,vals:{dest:e.dest||pv.dest||D.defDest(e.code),upf,bags:bags,loose:e.loose,units}}},
  say(e,c,p){return p.name+', '+(c.vals.dest==='COSTA'?'Costa':'Sierra')+', '+c.u+' unidades'}}};

let D=null,M=null,rec=null,sess=null,idle=null,last='';

function ui(){if($('pnV'))return;const st=D0.createElement('style');st.textContent=CSS;D0.head.appendChild(st);
 const b=D0.createElement('button');b.id='pnMic';b.type='button';b.title='Dictar por voz';b.textContent='🎤';b.onclick=open;D0.body.appendChild(b);
 const d=D0.createElement('div');d.id='pnV';d.innerHTML=`<h4><span id="pnVT">🎤 Dictar</span><button class="vb" data-v="close" style="padding:6px 12px">✕</button></h4><div class="vsub" id="pnVH"></div>
 <label style="display:flex;gap:8px;align-items:center;margin:6px 0;font-size:.8rem"><input type="checkbox" id="pnVCf" style="width:auto"> Confirmar con voz (lee el resumen y espera «confirma» o «corrige»)</label>

 d.addEventListener('click',e=>{const k=e.target.closest('[data-v]');if(!k)return;const a=k.dataset.v;if(a==='close')close();else if(a==='talk')talk();else if(a==='parse')interpret();else if(a==='make')make();else if(a==='del'){readCard();M.entries.splice(+k.dataset.i,1);card();if(!M.entries.length)status('Sin líneas: dicte de nuevo.','warn')}else if(a==='clear'){$('pnVTa').value='';$('pnVCard').innerHTML='';M=null}});
 d.addEventListener('input',e=>{if(e.target.closest('#pnVCard')){readCard();refresh()}});d.addEventListener('change',e=>{if(e.target.closest('#pnVCard')){readCard();card()}})}
function status(t,c){const s=$('pnVS');if(s){s.textContent=t||'';s.className='vm '+(c||'')}}
function open(){D=cfg.screen();if(!D)return;prep(D);ui();$('pnVT').textContent='🎤 '+D.title;$('pnVH').innerHTML=D.hint;
 const c=$('pnVCf');if(c&&!c.dataset.i){c.dataset.i=1;try{c.checked=localStorage.getItem('panalim_voice_confirm')!=='0'}catch(_){c.checked=true}c.addEventListener('change',()=>{try{localStorage.setItem('panalim_voice_confirm',c.checked?'1':'0')}catch(_){}})}
 $('pnV').style.display='block';$('pnMic').style.display='none';D0.body.style.paddingBottom='460px';status(last,'ok')}
function close(){endSess();sess=null;try{speechSynthesis.cancel()}catch(_){}$('pnV').style.display='none';D0.body.style.paddingBottom='';place()}
function prep(d){d.byCode=c=>d.catalog.find(p=>p.code===c);d.mode=d.mode||'set';d.prev=d.prev||(()=>null);d.allowed=d.allowed||(()=>null);d.defPpt=d.defPpt||(()=>0);d.defUpf=d.defUpf||(()=>0);d.defDest=d.defDest||(()=>'SIERRA');d.build=KINDS[d.kind]?(e,f)=>KINDS[d.kind].build(e,f):()=>{}}
function place(){const b=$('pnMic');if(!b){if(cfg.screen())ui();else return}const bb=$('pnMic'),vis=$('pnV').style.display==='block';bb.style.display=(!vis&&cfg.screen())?'block':'none'}

function endSess(){if(idle){clearInterval(idle);idle=null}if(sess)sess.active=false;try{rec&&rec.abort()}catch(_){}rec=null;btnState(false)}

 try{speechSynthesis.cancel()}catch(_){}endSess();ta.value='';$('pnVCard').innerHTML='';M=null;sess={active:true,mode:'dictate',acc:'',cur:'',last:Date.now()};runRec();
 idle=setInterval(()=>{if(sess&&sess.active&&sess.mode==='dictate'&&Date.now()-sess.last>30000){const had=(ta.value||'').trim();endSess();sess=null;if(had)interpret();else status('No se oyó nada.','warn')}},2000)}

 r.onstart=()=>{btnState(true);status(mode==='dictate'?'Escuchando… diga todo y termine con «registrar»':'Diga «confirma» o «corrige»…','ok')};
 r.onresult=e=>{if(!sess||!sess.active)return;const out=[];for(let i=0;i<e.results.length;i++){const t=(e.results[i][0].transcript||'').trim();if(!t)continue;if(out.length&&norm(t).startsWith(norm(out[out.length-1])))out[out.length-1]=t;else out.push(t)}
  const cur=out.join(' ');sess.last=Date.now();
  if(mode==='answer'){const a=norm(cur);if(/\b(corrige|corregir|corrijo|no|cancela|cancelar|repite|repetir|incorrecto|mal)\b/.test(a)){endSess();sess=null;speak('De acuerdo, repita el registro completo.',()=>startDictation())}else if(/\b(confirma|confirmo|confirmar|confirmado|si|correcto|registrar|registra|guardar|guarda|dale|adelante)\b/.test(a)){endSess();sess=null;make()}return}
  sess.cur=cur;const full=(sess.acc+' '+cur).trim();ta.value=full;if(cmdRe.test(norm(full)))finishByCmd()};
 r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;const m={'not-allowed':'Permiso de micrófono denegado: actívelo en los permisos del sitio.','service-not-allowed':'Este navegador no permite el reconocimiento de voz.','network':'Sin conexión con el servicio de voz. Revise el internet.','audio-capture':'No se encontró micrófono.'};endSess();sess=null;status(m[e.error]??('Error de voz: '+e.error),'bad')};
 r.onend=()=>{rec=null;if(!sess||!sess.active){btnState(false);return}
  if(mode==='dictate'){sess.acc=(sess.acc+' '+(sess.cur||'')).trim();sess.cur='';ta.value=sess.acc;setTimeout(runRec,120)}
  else{sess.tries=(sess.tries||0)+1;if(sess.tries<3){setTimeout(()=>{if(sess&&sess.active)runRec()},200)}else{endSess();sess=null;status('Sin respuesta por voz: use los botones de la tarjeta.','warn')}}};
 try{r.start()}catch(err){endSess();sess=null;status('No se pudo iniciar el micrófono: '+err.message,'bad')}}

function afterInterpret(){if(!M)return;const k=calc();if(k.block){status('No se puede registrar: '+k.bad,'bad');speak('No puedo registrar: '+k.bad+' Corrija en la tarjeta o repita.');return}
 if(!vcf()){status('Revise la tarjeta y pulse Registrar.','ok');return}

function interpret(){const raw=($('pnVTa').value||'').trim();if(!raw){status('Escriba o dicte primero.','warn');return}
 try{if(!D)D=cfg.screen();prep(D);let entries,meta={};
  if(D.kind==='esp'){entries=parseEsp(raw)}else{const r=parseList(raw,D);entries=r.entries;meta=r.meta;if(!entries.length&&!meta.name){status('No reconocí ningún producto en: «'+raw+'»','bad');$('pnVCard').innerHTML='';M=null;return}}
  M={entries,meta,d:D};last='';card();status('Revise y pulse Registrar'+(vcf()?' (o diga «confirma»)':'')+'.','ok')}catch(err){status('No pude interpretar: '+err.message,'bad')}}
function calc(){const d=M.d,res={rows:[],total:0,block:false,bad:'',msgs:[]};
 M.entries.forEach((e,i)=>{let r;
  if(d.kind==='esp'){const m=[];if(!String(e.name||'').trim())m.push(['bad','Falta el nombre del pedido.']);if(!(e.units>0))m.push(['bad','Faltan unidades.']);r={u:e.units>0?e.units:0,m,say:(e.name||'pedido')+', '+(e.units||0)+' unidades'+(e.note?', para '+e.note:'')}}
  else{r=KINDS[d.kind].calc(e,d);const p=d.byCode(e.code);r.say=p?KINDS[d.kind].say(e,r,p):'producto sin identificar';
   if(e.rest)r.m.push(['warn','No entendí: «'+e.rest+'».']);
   if(d.mode==='set'&&e.code&&M.entries.findIndex(x=>x.code===e.code)<i)r.m.push(['warn','Producto repetido: se usará la última línea.'])}
  res.rows.push(r);res.total+=r.u||0;r.m.forEach(x=>{const lab=d.kind==='esp'?(e.name||'línea '+(i+1)):((d.byCode(e.code)||{}).name||'línea '+(i+1));res.msgs.push([x[0],lab+': '+x[1]]);if(x[0]==='bad'&&!res.block){res.block=true;res.bad=lab+': '+x[1]}})});
 if(M.meta&&M.meta.name)res.msgs.push(['ok','Nombre: '+M.meta.name]);return res}
function card(){if(!M)return;const d=M.d,k=calc(),esp=d.kind==='esp';
 const head=esp?['Pedido','Unidades','Para / nota']:['Producto',...KINDS[d.kind].fields.map(f=>f.l),'Total u'];
 let h=`<table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}<th></th></tr></thead><tbody>`;
 M.entries.forEach((e,i)=>{const r=k.rows[i];
  if(esp){h+=`<tr><td><input class="vi" data-i="${i}" data-k="name" value="${E(e.name)}"></td><td><input class="vi" data-i="${i}" data-k="units" inputmode="numeric" value="${e.units==null?'':e.units}"></td><td><input class="vi" data-i="${i}" data-k="note" value="${E(e.note)}"></td><td><button class="vb" data-v="del" data-i="${i}" style="padding:4px 9px">✕</button></td></tr>`;return}
  const cs=(e.cands||[]).map(c=>d.byCode(c)).filter(Boolean),opts=(!e.code&&cs.length)?cs.concat(d.catalog.filter(p=>!cs.includes(p))):d.catalog;
  const pv=d.prev(e.code)||{},ph=KINDS[d.kind].calc(e,d).vals||{};
  h+=`<tr><td><select data-i="${i}" data-k="code"><option value="">— elegir —</option>${opts.map(p=>`<option value="${E(p.code)}"${p.code===e.code?' selected':''}>${E(p.name)}</option>`).join('')}</select></td>`;
  KINDS[d.kind].fields.forEach(f=>{const v=e[f.k];if(f.sel)h+=`<td><select data-i="${i}" data-k="${f.k}">${f.sel.map(o=>`<option value="${o[0]}"${((v||ph[f.k])===o[0])?' selected':''}>${o[1]}</option>`).join('')}</select></td>`;else h+=`<td><input class="vi" data-i="${i}" data-k="${f.k}" inputmode="numeric" value="${v==null?'':v}" placeholder="${ph[f.k]?ph[f.k]:''}"></td>`});
  h+=`<td><b data-tot="${i}">${r.u||''}</b></td><td><button class="vb" data-v="del" data-i="${i}" style="padding:4px 9px">✕</button></td></tr>`;
  const bf=d.before&&e.code?d.before(e.code):'';if(bf)h+=`<tr><td colspan="${KINDS[d.kind].fields.length+3}" class="vsub">antes: ${E(bf)} → se reemplaza</td></tr>`});
 h+=`</tbody></table><div class="vtot" id="pnVTot">Total: ${k.total} unidades</div><div id="pnVMs">${k.msgs.map(m=>`<div class="vm ${m[0]}">${E(m[1])}</div>`).join('')}</div>${M.meta.name?'':''}

function refresh(){if(!M)return;const k=calc();M.entries.forEach((e,i)=>{const b=$('pnVCard').querySelector('[data-tot="'+i+'"]');if(b)b.textContent=k.rows[i].u||''});$('pnVTot').textContent='Total: '+k.total+' unidades';$('pnVMs').innerHTML=k.msgs.map(m=>`<div class="vm ${m[0]}">${E(m[1])}</div>`).join('');const mk=$('pnVMake');if(mk)mk.disabled=k.block}

;(()=>{const CAT=PR.map(p=>({code:p.c,name:p.n,p:p.p,names:[p.n,...T3L.filter(x=>x.c===p.c&&x.n!==p.n).map(x=>x.n)]})).sort((a,b)=>a.name.localeCompare(b.name,'es'));
