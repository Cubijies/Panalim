async function exportKind(w){
 if(w==='note'){if(!S.disp.length&&!S.sp.length)return toast('Registre primero algún despacho o pedido especial.');return send('T2_LOCAL_PRINCIPAL_NOTE','BODEGA_DESPACHO_SIERRA+PRODUCCION',{folio:folio(),dispatches:S.disp,lines:dispBy(),specialOrders:S.sp,retainedPending:retPend(),note:'Nota de despacho al local principal (turno 2). Se factura como las notas a locales.'},'T2_NOTA_LOCAL_PRINCIPAL')}
 if(w==='t3'){if(!S.t3.length&&!S.sp.length&&!sobL().length&&!pastRows().length)return toast('Importe el T3 del moldeador, registre sobrantes o pastelería.');return send('T3_PRODUCTION','PRODUCCION',{t3Production:t3By().map(r=>({productCode:r.code,productName:r.name,trays:r.trays,looseUnits:r.loose,units:r.units})),especiales:S.sp,pastry:pastItems(),sobrantesT1:sobL().map(r=>({productCode:r.code,productName:r.name,units:r.units})),recordedBy:[...new Set(S.t3.map(x=>x.by).filter(Boolean))],note:'T3 + especiales + sobrantes del T1 (supervisor T2).'},'T3_PRODUCCION')}
 if(w==='past'){const bad=PAST.filter(x=>{const v=pv(x.id);return num(v.bags)>0&&!pUpf(x)&&!(num(v.units)>0)});if(bad.length)return toast('Falta «u/funda» (o escriba las unidades) en: '+bad.map(x=>x.name).join(', '));if(!pastRows().length)return toast('Registre primero la pastelería (fundas o unidades).');return send('PASTRY_PRODUCTION','PRODUCCION',{pastry:pastItems(),totals:{costa:pastTot().c,sierra:pastTot().s,total:pastTot().t},note:'Pastelería del día: lo que está en la pastelería Costa de la orden queda como Costa; lo demás va a Sierra.'},'PASTELERIA')}
 if(w==='full'){if(!S.relevo&&!confirm('No importó el relevo de T1: el consolidado saldrá SIN producción T1 y con sobrantes en negativo. ¿Enviarlo así de todos modos?'))return;const c=consol();return send('PRODUCTION_CONSOLIDATED','BODEGA_DESPACHO_SIERRA',{t1:c.rows,retenido:c.ret,t3:c.T3,especiales:c.esp,sobrantes:c.sob,resumen:c.resumen,totales:c.tot,pastry:pastItems(),note:'Total general = Neto T1 + Retenido + T3 + Especiales + Pastelería − Sobrantes.',t1Faltante:!S.relevo},'CONSOLIDADO_COMPLETO')}}

async function importFile(file,kind){try{const o=JSON.parse(await file.text());const k=o.manifest?.kind;
 if(kind==='relevo'){if(k!=='T1_TO_T2_HANDOFF')throw Error(`el archivo es «${k||o.schema||o.kind||'desconocido'}» y aquí se espera el relevo «T1_TO_T2_HANDOFF» (se llama PANALIM_T1_Relevo_para_T2_…). El archivo RESPALDO_interno no sirve.`);
  if(!(await verify(o)))toast('⚠ El sello no coincide (archivo modificado); se importa igualmente. Revise las cantidades.');const d=o.detail,t1=(d.t1Production||[]).map(x=>({code:x.productCode,name:x.productName,A:num(x.teamA),B:num(x.teamB),total:num(x.total)}));
  S.relevo={bundleId:o.manifest.bundleId,date:o.manifest.operationalDate,lot:o.manifest.lotId,t1:t1.length?t1:(d.wipLocations||[]).filter(x=>num(x.goodMoldedU)>0).map(x=>({code:x.productCode,name:x.productName,A:0,B:0,total:num(x.goodMoldedU)})),retained:(d.retained||[]).map(x=>({code:x.productCode||x.code,name:x.productName||x.name,units:num(x.units),state:x.state})),wip:(d.wipLocations||[]).filter(x=>num(x.noDespachadoU)>0),sinRetenido:!d.retained};toast('Relevo de T1 importado.')}
 else{if(k!=='T3_PRODUCTION')throw Error(`el archivo es «${k||'desconocido'}» y aquí se espera «T3_PRODUCTION» (lo envía la app T3 Moldeador).`);if(!(await verify(o)))toast('⚠ El sello no coincide (archivo modificado); se importa igualmente. Revise las cantidades.');
  S.t3=S.t3.filter(x=>x.bundleId!==o.manifest.bundleId);(o.detail.t3Production||[]).forEach(x=>S.t3.push({code:x.productCode,name:x.productName||pr(x.productCode).n,trays:num(x.trays),loose:num(x.looseUnits),units:num(x.units),by:(o.detail.recordedBy||[])[0]||'',bundleId:o.manifest.bundleId,date:o.manifest.operationalDate}));toast('T3 del moldeador importado.')}
 save();render()}catch(x){toast('Archivo rechazado: '+x.message)}}

  KINDS[d.kind].fields.forEach(f=>{const v=e[f.k];if(f.sel)h+=`<td><select data-i="${i}" data-k="${f.k}">${f.sel.map(o=>`<option value="${o[0]}"${((v||ph[f.k])===o[0])?' selected':''}>${o[1]}</option>`).join('')}</select></td>`;else h+=`<td><input class="vi" data-i="${i}" data-k="${f.k}" inputmode="numeric" value="${v==null?'':v}" placeholder="${ph[f.k]?ph[f.k]:''}"></td>`});
  h+=`<td><b data-tot="${i}">${r.u||''}</b></td><td><button class="vb" data-v="del" data-i="${i}" style="padding:4px 9px">✕</button></td></tr>`;
  const bf=d.before&&e.code?d.before(e.code):'';if(bf)h+=`<tr><td colspan="${KINDS[d.kind].fields.length+3}" class="vsub">antes: ${E(bf)} → se reemplaza</td></tr>`});
 h+=`</tbody></table><div class="vtot" id="pnVTot">Total: ${k.total} unidades</div><div id="pnVMs">${k.msgs.map(m=>`<div class="vm ${m[0]}">${E(m[1])}</div>`).join('')}</div>${M.meta.name?'':''}
 <div class="vrow"><button class="vb go" data-v="make" id="pnVMake"${k.block?' disabled':''}>✔ Registrar</button><button class="vb" data-v="talk">🎤 Dictar de nuevo</button><button class="vb" data-v="clear">Limpiar</button></div>`;
 $('pnVCard').innerHTML=h}
function refresh(){if(!M)return;const k=calc();M.entries.forEach((e,i)=>{const b=$('pnVCard').querySelector('[data-tot="'+i+'"]');if(b)b.textContent=k.rows[i].u||''});$('pnVTot').textContent='Total: '+k.total+' unidades';$('pnVMs').innerHTML=k.msgs.map(m=>`<div class="vm ${m[0]}">${E(m[1])}</div>`).join('');const mk=$('pnVMake');if(mk)mk.disabled=k.block}
function readCard(){if(!M)return;$('pnVCard').querySelectorAll('[data-i][data-k]').forEach(el=>{const i=+el.dataset.i,e=M.entries[i];if(!e)return;const k=el.dataset.k;let v=el.value;if(k==='code'){e.code=v;e.sure=true;e.cands=[];return}if(k==='name'||k==='note'){e[k]=v;return}if(k==='dest'){e.dest=v;return}if(el.tagName==='SELECT'&&el.dataset.k!=='code'){e[k]=v;return}v=String(v).replace(/[^0-9]/g,'');e[k]=v===''?null:Number(v)})}
function make(){if(!M)return;readCard();const k=calc();if(k.block){status('No se puede registrar: '+k.bad,'bad');return}
 const rows=M.entries.map((e,i)=>({e,c:k.rows[i]}));let msg='';try{msg=M.d.apply(rows,M.meta)||'Registrado.'}catch(err){status('Error al registrar: '+err.message,'bad');return}
 last='✔ '+msg;endSess();sess=null;try{speechSynthesis.cancel()}catch(_){}M=null;$('pnVTa').value='';$('pnVCard').innerHTML='';status(last,'ok');speak(msg);try{cfg.toast&&cfg.toast(msg)}catch(_){}}
let cfg={screen:()=>null};
window.PNVoice={init(c){cfg=c;ui();setInterval(()=>{try{let vis=$('pnV').style.display==='block';if(vis){const sc=cfg.screen();if(!sc||(D&&sc.key!==D.key)){close();vis=false}}$('pnMic').style.display=(!vis&&cfg.screen())?'block':'none'}catch(_){}},700)},parseList,parseEsp,ext,digits,norm,matchAt,KINDS,prep,open};
})();

;(()=>{const C={};
const catPR=()=>C.pr||(C.pr=PR.map(p=>({code:p.c,name:p.n,p:p.p})).sort((a,b)=>a.name.localeCompare(b.name,'es')));
const catPast=()=>C.pa||(C.pa=PAST.map(x=>({code:x.id,name:x.name,names:[x.name,x.costa].filter(Boolean)})));
const lat=(key,title,hint,store)=>({key,title,kind:'lata',mode:'add',hint,catalog:catPR(),defPpt:c=>c?pr(c).p:0,
 apply(rows){rows.forEach(({e,c})=>{const row={code:e.code,name:pr(e.code).n,ppt:c.vals.ppt,trays:c.vals.trays,loose:c.vals.loose,units:c.u,time:hhmm()};store(row)});save();render();return rows.length+(rows.length===1?' línea registrada.':' líneas registradas.')}});
const SC={
 nota:()=>lat('nota','Dictar despacho al local principal','Diga el producto y sus cantidades; cada línea queda con su hora. Ej.: «Tapado, 10 latas de 18. Pan de agua, 5 latas, 6 sueltas. <b>Registrar</b>».',r=>S.disp.push(r)),
 t3:()=>lat('t3','Dictar T3 a mano','Ej.: «Mollete, 8 latas de 20. Tornillo, 4 latas, 3 sueltas. <b>Registrar</b>».',r=>S.t3.push({...r,by:'manual',bundleId:'MANUAL'})),
 sob:()=>C.sob||(C.sob={key:'sob',title:'Dictar sobrantes de T1',kind:'units',mode:'set',catalog:catPR(),
  hint:'Diga producto y <b>unidades</b>. Ej.: «Tapado 120, pan de agua 60, mollete 36. <b>Registrar</b>». También sirve «tapado 5 latas de 18».',
  before:c=>S.sob[c]?S.sob[c]+' u':'',
  apply(rows){rows.forEach(({e,c})=>{if(c.u>0)S.sob[e.code]=c.u});save();render();return rows.length+' sobrantes registrados.'}}),
 past:()=>C.past||(C.past={key:'past',title:'Dictar pastelería',kind:'past',mode:'set',catalog:catPast(),
  hint:'Diga producto y cantidad: fundas, sueltas o unidades, y si quiere «costa» o «sierra». Ej.: «Biscochos, 10 fundas, 4 sueltas, costa. Galletas, 120 unidades. <b>Registrar</b>».',
  prev:c=>{const x=PAST.find(q=>q.id===c);return x?{upf:pUpf(x),dest:pDest(x)}:null},defUpf:c=>{const x=PAST.find(q=>q.id===c);return x?pUpf(x):0},defDest:c=>{const x=PAST.find(q=>q.id===c);return x?pDest(x):'SIERRA'},
  before:c=>{const x=PAST.find(q=>q.id===c),u=pUnits(x);return u?u+' u ('+(pDest(x)==='COSTA'?'Costa':'Sierra')+')':''},
  apply(rows){rows.forEach(({e,c})=>{const v=pv(e.code);if(e.dest)v.dest=e.dest;if(e.upf!=null)v.upf=String(e.upf);if(c.vals.units!=null){v.units=String(c.vals.units)}else{v.bags=String(c.vals.bags||'');v.loose=String(c.vals.loose||'');v.units=''}});save();render();return rows.length+' líneas de pastelería registradas.'}}),
 esp:()=>C.esp||(C.esp={key:'esp',title:'Dictar pedidos especiales',kind:'esp',
  hint:'Diga el pedido, las unidades y «para …». Ej.: «Pastel de boda, 3 unidades, para Juan. Siguiente. Pan de yuca, 50 unidades. <b>Registrar</b>».',
  apply(rows){rows.forEach(({e})=>S.sp.push({name:String(e.name).trim(),units:e.units,note:String(e.note||'').trim()}));save();render();return rows.length+(rows.length===1?' pedido especial registrado.':' pedidos especiales registrados.')}})};
PNVoice.init({toast:m=>toast(m),screen:()=>{const f=SC[S.tab];return f?f():null}});})();
