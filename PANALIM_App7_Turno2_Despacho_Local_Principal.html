async function importFile(file,kind){try{const o=JSON.parse(await file.text());const k=o.manifest?.kind;
 if(kind==='relevo'){if(k!=='T1_TO_T2_HANDOFF')throw Error(`el archivo es «${k||o.schema||o.kind||'desconocido'}» y aquí se espera el relevo «T1_TO_T2_HANDOFF» (se llama PANALIM_relevo_T1_…). El archivo RESPALDO_interno no sirve.`);
  if(!(await verify(o)))throw Error('el sello SHA-256 no coincide: el archivo fue modificado o está incompleto.');const d=o.detail,t1=(d.t1Production||[]).map(x=>({code:x.productCode,name:x.productName,A:num(x.teamA),B:num(x.teamB),total:num(x.total)}));
  S.relevo={bundleId:o.manifest.bundleId,date:o.manifest.operationalDate,lot:o.manifest.lotId,t1:t1.length?t1:(d.wipLocations||[]).filter(x=>num(x.goodMoldedU)>0).map(x=>({code:x.productCode,name:x.productName,A:0,B:0,total:num(x.goodMoldedU)})),retained:(d.retained||[]).map(x=>({code:x.productCode||x.code,name:x.productName||x.name,units:num(x.units),state:x.state})),wip:(d.wipLocations||[]).filter(x=>num(x.noDespachadoU)>0),sinRetenido:!d.retained};toast('Relevo de T1 importado.')}
 else{if(k!=='T3_PRODUCTION')throw Error(`el archivo es «${k||'desconocido'}» y aquí se espera «T3_PRODUCTION» (lo envía la app T3 Moldeador).`);if(!(await verify(o)))throw Error('el sello SHA-256 no coincide.');
  S.t3=S.t3.filter(x=>x.bundleId!==o.manifest.bundleId);(o.detail.t3Production||[]).forEach(x=>S.t3.push({code:x.productCode,name:x.productName,trays:num(x.trays),loose:num(x.looseUnits),units:num(x.units),by:(o.detail.recordedBy||[])[0]||'',bundleId:o.manifest.bundleId,date:o.manifest.operationalDate}));toast('T3 del moldeador importado.')}
 save();render()}catch(x){toast('Archivo rechazado: '+x.message)}}

 else if(d.act==='newday'){if(!confirm('¿Iniciar nuevo día? Se borran despachos, especiales, sobrantes, T3 y relevo. Descargue antes el respaldo si lo necesita.'))return;S={tab:'relevo',relevo:null,disp:[],sp:[],sob:{},t3:[],past:{},date:today(),folio:(S.folio||1)+1};save();render();toast('Nuevo día listo.')}});
document.addEventListener('change',e=>{if(e.target.dataset?.pf&&e.target.tagName==='SELECT'){pv(e.target.dataset.pf.split('|')[0]).dest=e.target.value;save();render();return}if(e.target.id==='fRel'&&e.target.files[0]){importFile(e.target.files[0],'relevo');e.target.value=''}else if(e.target.id==='fT3'&&e.target.files[0]){importFile(e.target.files[0],'t3');e.target.value=''}else if(/^(d|m)P$/.test(e.target.id)){const id=e.target.id[0];$('#'+id+'F').value=pr(e.target.value).p||''}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset?.pf){const [id,f]=t.dataset.pf.split('|');if(f!=='dest'){const c=String(t.value).replace(/[^0-9]/g,'');if(c!==t.value)t.value=c}pv(id)[f]=t.value;save();const x=PAST.find(q=>q.id===id),u=$('[data-pu="'+id+'"]');if(u)u.textContent=pUnits(x)||'';const p=pastTot();$('#pcC').textContent=fm(p.c);$('#pcS').textContent=fm(p.s);$('#pcT').textContent=fm(p.t);return}if(t.dataset?.sob){const v=parseInt(String(t.value).replace(/[^0-9]/g,''),10)||0;if(v>0)S.sob[t.dataset.sob]=v;else delete S.sob[t.dataset.sob];$('#sobT').textContent=fm(sumBy(sobL(),x=>x.units));save()}});
render();

<script>

(function(){'use strict';
const KEY='panalim_contactos_v1',DEST=[['PROD','Producción (moldeado)'],['SUP','Supervisor T2'],['SIERRA','Despacho Sierra'],['COSTA','Despacho Costa'],['HUB','Hub y Contabilidad'],['LOCALES','Locales'],['ARQ','Arqueo Costa']],

const digits=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('0')&&d.length===10)d='593'+d.slice(1);return d};
let cur=null;

 m.innerHTML='<div style="background:#fffefa;border-radius:14px;max-width:420px;width:100%;padding:16px;font:14px system-ui,sans-serif;color:#2e2825"><b style="font-size:1rem">Enviar archivo</b><div id="pnShN" style="font-size:.74rem;color:#746b65;margin:4px 0 10px;word-break:break-all"></div><label style="font-size:.74rem">Destino<select id="pnShD" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #ded5cc;border-radius:8px"></select></label><label style="font-size:.74rem">Teléfono (se guarda)<input id="pnShP" inputmode="tel" placeholder="0991234567" style="width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ded5cc;border-radius:8px;box-sizing:border-box"></label><div style="display:grid;gap:6px"><button id="pnShF" style="padding:10px;border-radius:9px;border:0;background:#75242a;color:#fff;font-weight:700">Compartir archivo adjunto…</button><button id="pnShW" style="padding:10px;border-radius:9px;border:0;background:#1f9d55;color:#fff;font-weight:700">WhatsApp (abrir chat)</button><button id="pnShT" style="padding:10px;border-radius:9px;border:0;background:#2a8fd0;color:#fff;font-weight:700">Telegram (abrir chat)</button><button id="pnShC" style="padding:9px;border-radius:9px;border:1px solid #ded5cc;background:#fff">Cerrar</button></div><div style="font-size:.68rem;color:#746b65;margin-top:8px">El archivo ya se descargó. «Compartir archivo» lo adjunta desde el celular; WhatsApp y Telegram abren el chat y usted adjunta el archivo descargado.</div></div>';document.body.appendChild(m);
 const $=i=>m.querySelector(i),sel=$('#pnShD');sel.innerHTML=DEST.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');

 $('#pnShT').onclick=()=>{const p=phone();try{navigator.clipboard?.writeText(msg())}catch(_){}window.open(p?'https://t.me/+'+p:'https://t.me/','_blank')};
 $('#pnShF').onclick=async()=>{phone();try{const f=new File([cur.text],cur.name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:cur.name,text:msg()});else alert('Este navegador no permite adjuntar. Use WhatsApp/Telegram y adjunte el archivo descargado.')}catch(e){}};
 return m}

})();
